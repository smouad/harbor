<!doctype html>
<html><head><meta charset="utf-8"><title>Agent form fixture</title>
<style>
  body { font: 16px -apple-system, sans-serif; margin: 24px; }
  #cover { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.4); display: none; }
  .row { margin: 10px 0; }
  #far { margin-top: 1600px; }
</style></head>
<body>
<h1>Checkout</h1>
<p id="hover-state">not hovered</p>
<p id="order-state">no order</p>
<div class="row"><label for="name">Full name</label> <input id="name" name="name" placeholder="Your name"></div>
<div class="row"><label for="pw">Password</label> <input id="pw" name="password" type="password"></div>
<div class="row"><label>Country <select id="country"><option value="">Pick</option><option value="ma">Morocco</option><option value="de">Germany</option></select></label></div>
<div class="row"><label><input type="checkbox" id="terms"> I agree</label></div>
<div class="row"><textarea id="notes" aria-label="Notes"></textarea></div>
<div class="row" id="editor" contenteditable="true" aria-label="Rich editor" style="border:1px solid #999;min-height:20px"></div>
<div class="row"><button id="save" data-testid="save-btn">Save draft</button>
<button id="hover-target" onmouseenter="document.getElementById('hover-state').textContent='hovered'">Hover me</button>
<button id="covered">Covered button</button>
<button id="open-popup" onclick="window.open('/article.html', '_blank')">Open popup</button></div>
<div class="row"><button id="buy">Place order</button> <button id="dlg">Ask</button></div>
<div class="row"><input type="file" id="file" multiple style="display:none"><button id="drop" onclick="document.getElementById('file').click()">Attach files</button></div>
<form id="f" action="/article.html" method="get"><input name="q" id="q" aria-label="Search"><button type="submit" id="go">Search</button></form>
<iframe id="frame" src="/frame.html" style="width:300px;height:80px"></iframe>
<p id="far"><button id="far-btn">Far away</button></p>
<div id="cover"></div>
<script>
  window.events = [];
  const log = (e) => window.events.push({ type: e.type, id: e.target.id, trusted: e.isTrusted, key: e.key, value: e.target.value });
  for (const t of ["click", "input", "change", "keydown", "mouseover"]) document.addEventListener(t, log, true);
  document.getElementById("buy").onclick = () => { window.ordered = true; document.getElementById("order-state").textContent = "ordered"; };
  document.getElementById("save").onclick = () => { window.saved = (window.saved || 0) + 1; };
  document.getElementById("far-btn").onclick = () => { window.farClicked = true; };
  document.getElementById("dlg").onclick = () => { window.confirmed = confirm("Delete everything?"); window.prompted = prompt("Your nickname?", "anon"); alert("done"); };
  document.getElementById("file").onchange = (e) => { window.files = [...e.target.files].map(f => f.name + ":" + f.size); };
  document.getElementById("covered").onclick = () => { window.coveredClicked = true; };
  window.showCover = () => { document.getElementById("cover").style.display = "block"; };
  document.getElementById("cover").onclick = () => { document.getElementById("cover").style.display = "none"; };
</script>
</body></html>
